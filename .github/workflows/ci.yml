name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: CI only reads the repository and never needs production secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  typescript:
    name: TypeScript (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI contract is up to date
        run: pnpm contracts:check
      - run: pnpm build

  database:
    name: Database (migrations, RLS tests, integration)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # ClamAV daemon (signatures embedded in the image) for the antivirus of uploads (SEC-01).
    services:
      clamav:
        image: clamav/clamav:stable
        ports:
          - 3310:3310
      # Transit engine of the signing keys (SEC-04, ADR-027), development mode: test token, memory only.
      openbao:
        image: quay.io/openbao/openbao:2.7.1
        ports:
          - 8200:8200
        env:
          BAO_DEV_ROOT_TOKEN_ID: ci-only-openbao-token
          BAO_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start the local Supabase stack (migrations + synthetic seed replayed from scratch)
        run: |
          pnpm exec tsx scripts/ensure-signing-key.ts
          pnpm exec supabase start -x studio,imgproxy,vector,logflare,supavisor,edge-runtime,realtime,postgres-meta
      - name: Lint the business schema
        run: pnpm exec supabase db lint --schema app --level warning --fail-on warning
      - name: Database tests (pgTAP)
        run: pnpm test:db
      - name: Integration tests (Auth -> API -> RLS, worker queue)
        env:
          ANTIVIRUS_URL: tcp://localhost:3310
          SIGNING_TRANSIT_TEST_URL: http://localhost:8200
          SIGNING_TRANSIT_TEST_TOKEN: ci-only-openbao-token
        run: |
          pnpm setup:local
          pnpm seed:assets
          pnpm test:integration
      # CAP-01: the full bench (10 000 sites) is run by hand (docs/volumetrie/cap-01.md); here
      # 1 000 sites, to keep the bench working and fail on any request in error.
      - name: Volumetry bench, reduced (1 000 sites, no request in error)
        run: pnpm bench:volume --sites 1000 --jobs 10000 --seconds 5
      - if: always()
        run: pnpm exec supabase stop --no-backup

  flutter:
    name: Flutter (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build
          git diff --exit-code -- lib
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test

  # EXP-04 (ADR-030): the staging flavor built in release with a throwaway key created for the run:
  # signing configuration, R8 and flavors hold, and a release never builds without its key. The real
  # key never reaches CI.
  mobile-release:
    name: Android release (préproduction, clé jetable)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.5
          channel: stable
          cache: true
      - run: pnpm install --frozen-lockfile
      - name: Throwaway signing key and fictitious staging configuration
        run: |
          pnpm mobile:release signing-key --out "$RUNNER_TEMP/android-key" --organization "CI"
          cat > "$RUNNER_TEMP/defines.json" <<'JSON'
          {
            "ENV": "staging",
            "API_BASE_URL": "https://preprod.firescape.invalid/api/v1",
            "AUTH_URL": "https://preprod.firescape.invalid/auth/v1",
            "AUTH_PUBLISHABLE_KEY": "sb_publishable_ci",
            "TRUSTED_SIGNING_KEYS": "root:ed25519-root:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          }
          JSON
      - name: Build, then verify signer and identifier
        run: |
          pnpm mobile:release build --flavor staging --defines "$RUNNER_TEMP/defines.json" \
            --signing "$RUNNER_TEMP/android-key/key.properties" --out "$RUNNER_TEMP/release"
          pnpm mobile:release verify --apk "$RUNNER_TEMP"/release/firescape-staging-*.apk --flavor staging \
            --certificate "$(cat "$RUNNER_TEMP/android-key/certificat-sha256.txt")"
      - name: A release never builds without its key
        working-directory: apps/mobile
        run: |
          if flutter build apk --release --flavor staging --dart-define-from-file="$RUNNER_TEMP/defines.json"; then
            echo "Release construite sans clé de signature" >&2
            exit 1
          fi
