name: etare_platform
description: "Services Android de l'application OPS : clé du terminal dans le Keystore, horloge monotone, espace libre, protection de l'écran (SEC-05, CAP-02)."
# Paquet privé de l'application : jamais publié.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.4
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: fr.etare.platform
        pluginClass: EtarePlatformPlugin
