# Configuration build_runner / drift_dev.
# Régénérer après modification du schéma :
#   dart run build_runner build --delete-conflicting-outputs
targets:
  $default:
    builders:
      drift_dev:
        options:
          # Dates stockées en texte ISO-8601 (lisible, triable, sans ambiguïté
          # de fuseau) plutôt qu'en timestamp Unix entier.
          store_date_time_values_as_text: true
          # Base déclarée pour `dart run drift_dev make-migrations`
          # (instantanés de schéma versionnés + tests de migration générés).
          databases:
            app_database: lib/src/data/local/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
